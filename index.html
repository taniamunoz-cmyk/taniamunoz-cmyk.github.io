<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Justification Letter Generator — Terra Energy</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --green: #2d7a3a;
  --green-light: #e8f5eb;
  --green-mid: #4a9e5c;
  --dark: #111815;
  --mid: #3a4a3e;
  --muted: #7a8c7e;
  --border: #d0dbd2;
  --bg: #f7faf7;
  --white: #ffffff;
  --radius: 10px;
  --shadow: 0 2px 16px rgba(45,122,58,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--dark);
  min-height: 100vh;
  font-size: 15px;
}

/* ── HEADER ── */
.header {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 18px 40px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo-mark {
  width: 36px; height: 36px;
  background: var(--green);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}

.logo-mark svg { width: 20px; height: 20px; fill: white; }

.header-text h1 { font-size: 16px; font-weight: 600; color: var(--dark); line-height: 1; }
.header-text p { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ── LAYOUT ── */
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 36px 24px 80px;
}

/* ── STEP INDICATOR ── */
.steps {
  display: flex;
  align-items: center;
  gap: 0;
  margin-bottom: 36px;
}

.step {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
  font-weight: 400;
}

.step.active { color: var(--green); font-weight: 500; }
.step.done { color: var(--green-mid); }

.step-num {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
  color: var(--muted);
  flex-shrink: 0;
}

.step.active .step-num { background: var(--green); color: white; }
.step.done .step-num { background: var(--green-mid); color: white; }

.step-line {
  flex: 1;
  height: 1px;
  background: var(--border);
  margin: 0 12px;
  min-width: 20px;
}

/* ── SECTION ── */
.section {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 32px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.section-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── FIELDS ── */
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.field-grid.full { grid-template-columns: 1fr; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 500; color: var(--mid); }

.field input,
.field textarea,
.field select {
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 7px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--dark);
  background: var(--white);
  transition: border-color 0.15s;
  outline: none;
  width: 100%;
}

.field input:focus,
.field textarea:focus,
.field select:focus { border-color: var(--green); }

.field textarea { resize: vertical; min-height: 86px; line-height: 1.5; }

/* ── TYPE GRID ── */
.type-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  gap: 8px;
}

.type-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 13px;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.type-btn:hover { border-color: var(--green-mid); background: var(--green-light); }

.type-btn.active {
  border-color: var(--green);
  background: var(--green-light);
  box-shadow: 0 0 0 2px rgba(45,122,58,0.15);
}

.type-num {
  font-size: 10px;
  font-weight: 600;
  color: var(--green-mid);
  font-family: 'DM Mono', monospace;
}

.type-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--dark);
  line-height: 1.3;
}

/* ── EXTRA FIELDS ── */
#extra-section { display: none; }

/* ── GENERATE BUTTON ── */
.gen-btn {
  width: 100%;
  padding: 14px 24px;
  background: var(--green);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: background 0.15s;
}

.gen-btn:hover { background: #235f2d; }
.gen-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── OUTPUT ── */
#output-section { display: none; }

.output-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}

.output-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.action-btn {
  padding: 8px 16px;
  border-radius: 7px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}

.btn-primary {
  background: var(--green);
  color: white;
  border: none;
}

.btn-primary:hover { background: #235f2d; }

.btn-outline {
  background: white;
  color: var(--dark);
  border: 1px solid var(--border);
}

.btn-outline:hover { border-color: var(--green); color: var(--green); }

.btn-new {
  background: var(--green-light);
  color: var(--green);
  border: 1px solid rgba(45,122,58,0.2);
}

.btn-new:hover { background: #d0ecda; }

.letter-preview {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 32px;
  font-family: 'DM Mono', monospace;
  font-size: 12.5px;
  line-height: 1.8;
  color: var(--dark);
  white-space: pre-wrap;
  word-break: break-word;
}

/* ── STATUS ── */
.status-bar {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: var(--green-light);
  border: 1px solid rgba(45,122,58,0.2);
  border-radius: 8px;
  margin-top: 16px;
  font-size: 13px;
  color: var(--green);
  font-weight: 500;
}

.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(45,122,58,0.3);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  flex-shrink: 0;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── PDF SUCCESS TOAST ── */
.toast {
  position: fixed;
  bottom: 28px;
  right: 28px;
  background: var(--dark);
  color: white;
  padding: 12px 20px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  transform: translateY(80px);
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 999;
}

.toast.show { transform: translateY(0); opacity: 1; }

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .container { padding: 20px 16px 60px; }
  .section { padding: 20px 18px; }
  .header { padding: 14px 18px; }
  .field-grid { grid-template-columns: 1fr; }
  .type-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo-mark">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
  </div>
  <div class="header-text">
    <h1>Justification Letter Generator</h1>
    <p>Terra Energy — American Solar Installation Company</p>
  </div>
</div>

<div class="container">

  <!-- STEPS -->
  <div class="steps">
    <div class="step active" id="s1"><span class="step-num">1</span> Project data</div>
    <div class="step-line"></div>
    <div class="step" id="s2"><span class="step-num">2</span> Letter type</div>
    <div class="step-line"></div>
    <div class="step" id="s3"><span class="step-num">3</span> Details</div>
    <div class="step-line"></div>
    <div class="step" id="s4"><span class="step-num">4</span> PDF ready</div>
  </div>

  <!-- STEP 1: PROJECT DATA -->
  <div class="section" id="step1">
    <div class="section-title">Project data</div>
    <div class="field-grid">
      <div class="field">
        <label>Client name</label>
        <input type="text" id="client" placeholder="JOHN DOE" autocomplete="off">
      </div>
      <div class="field">
        <label>Permit number</label>
        <input type="text" id="permit" placeholder="SOL26-0001">
      </div>
    </div>
    <div style="margin-top:14px">
      <div class="field field-grid full">
        <label>Full address</label>
        <input type="text" id="address" placeholder="123 MAIN ST ORLANDO FLORIDA 32801">
      </div>
    </div>
  </div>

  <!-- STEP 2: TYPE -->
  <div class="section" id="step2">
    <div class="section-title">Letter type</div>
    <div class="type-grid" id="typeGrid"></div>
  </div>

  <!-- STEP 3: EXTRA FIELDS -->
  <div class="section" id="extra-section">
    <div class="section-title">Additional details</div>
    <div id="extra-content"></div>
  </div>

  <!-- NOTES -->
  <div class="section">
    <div class="section-title">Notes for the engineer (optional)</div>
    <div class="field">
      <textarea id="notes" placeholder="Inspector comments, specific field conditions, special equipment..."></textarea>
    </div>
  </div>

  <!-- GENERATE -->
  <button class="gen-btn" id="genBtn" onclick="generate()">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    Generate letter &amp; download PDF
  </button>

  <div class="status-bar" id="status">
    <div class="spinner"></div>
    <span id="status-text">Generating letter...</span>
  </div>

  <!-- OUTPUT -->
  <div class="section" id="output-section" style="margin-top:24px;">
    <div class="output-header">
      <div class="section-title" style="margin:0;">Generated letter</div>
      <div class="output-actions">
        <button class="action-btn btn-outline" onclick="copyLetter()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy text
        </button>
        <button class="action-btn btn-primary" id="pdfBtn" onclick="downloadPDF()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          Download PDF
        </button>
        <button class="action-btn btn-new" onclick="resetForm()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>
          New letter
        </button>
      </div>
    </div>
    <div class="letter-preview" id="letterPreview"></div>
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toast-text">PDF downloaded</span>
</div>

<script>
const TYPES = [
  {id:"interconnection_change",   n:1,  t:"Interconnection change"},
  {id:"tap_location",             n:2,  t:"Tap location change"},
  {id:"supply_side_neutral",      n:3,  t:"Supply-side neutral"},
  {id:"neutral_inspector",        n:4,  t:"Neutral – inspector comment"},
  {id:"mlo_mbe",                  n:5,  t:"MLO panel + MBE added"},
  {id:"mbe_no_space",             n:6,  t:"MBE – no space in subpanel"},
  {id:"panel_model_change",       n:7,  t:"Module substitution"},
  {id:"module_layout_change",     n:8,  t:"Module layout change"},
  {id:"main_breaker_discrepancy", n:9,  t:"Main breaker mismatch"},
  {id:"fuse_error",               n:10, t:"Fuse / OCPD error"},
  {id:"dc_conductor_error",       n:11, t:"DC conductor size error"},
  {id:"subpanel_error",           n:12, t:"Subpanel mismatch"},
  {id:"grounding_error",          n:13, t:"Grounding conductor"},
  {id:"gec_insulation",           n:14, t:"GEC insulation"},
  {id:"bonding_ac_disconnect",    n:15, t:"Bonding – AC Disconnect"},
  {id:"conduit_fill",             n:16, t:"Conduit & box fill"},
  {id:"labels",                   n:17, t:"NEC labeling variance"},
  {id:"equipment_location",       n:18, t:"Equipment relocation"},
  {id:"equipment_substitution",   n:19, t:"Equipment substitution"},
  {id:"nec_705_12",               n:20, t:"NEC 705.12(B)(3)(3)"},
  {id:"confirmation_supply",      n:21, t:"Supply-side confirmation"},
  {id:"multiple_modifications",   n:22, t:"Multiple modifications"},
  {id:"custom",                   n:23, t:"Custom / new situation"}
];

const EXTRA = {
  interconnection_change:`
    <div class="field-grid">
      <div class="field"><label>Original method (plans)</label>
        <select id="om"><option value="load side tap">Load side tap</option><option value="backfeed breaker at subpanel">Backfeed breaker – subpanel</option><option value="line side tap">Line side tap</option></select></div>
      <div class="field"><label>New method installed</label>
        <select id="nm"><option value="line side tap">Line side tap</option><option value="supply side connection per NEC 705.11">Supply side (NEC 705.11)</option><option value="load side tap at MSP">Load side tap at MSP</option></select></div>
    </div>
    <div class="field-grid full" style="margin-top:12px"><div class="field"><label>Reason for change</label>
      <select id="cr"><option value="MLO panel – no main breaker available">MLO panel (no main breaker)</option><option value="no safe or adequate access to subpanel">No safe access to subpanel</option><option value="actual service configuration does not match design assumptions">Service config doesn't match design</option></select></div></div>`,
  tap_location:`<div class="field-grid">
    <div class="field"><label>Original tap location (plans)</label><input type="text" id="otl" placeholder="subpanel"></div>
    <div class="field"><label>Actual tap location</label><input type="text" id="atl" placeholder="main service panel (MSP)"></div></div>`,
  neutral_inspector:`<div class="field-grid full"><div class="field"><label>Inspector comment</label><textarea id="ic" placeholder="Inspector noted neutral should be tapped ahead of main breaker"></textarea></div></div>
    <div class="field-grid full" style="margin-top:12px"><div class="field"><label>Actual neutral termination point</label><input type="text" id="np" placeholder="neutral busbar inside main service panel"></div></div>`,
  mlo_mbe:`<div class="field-grid">
    <div class="field"><label>Panel found on site</label><select id="mt"><option value="main lug only (MLO) panel">MLO panel</option><option value="main lug load center without integral main breaker">Main lug load center</option></select></div>
    <div class="field"><label>Solution installed</label><select id="ms"><option value="enclosure with main breaker (MBE)">Enclosure with MBE</option><option value="line side tap per NEC 705.11">Line side tap (NEC 705.11)</option></select></div></div>`,
  mbe_no_space:`<div class="field-grid full"><div class="field"><label>Condition found</label><select id="nsi"><option value="no available space to install the additional main breaker">No space for additional MB</option><option value="insufficient working clearance per NEC 110.26">Insufficient clearance (NEC 110.26)</option></select></div></div>
    <div class="field-grid full" style="margin-top:12px"><div class="field"><label>Solution installed</label><input type="text" id="nss" placeholder="MBE added between main panel and subpanel; tap on supply side of new MBE"></div></div>`,
  panel_model_change:`<div class="field-grid">
    <div class="field"><label>Original module (plans)</label><input type="text" id="om2" placeholder="CANADIAN SOLAR 445W CS6.1-54TM-445H"></div>
    <div class="field"><label>Original qty</label><input type="number" id="oq" placeholder="28"></div></div>
    <div class="field-grid" style="margin-top:12px">
    <div class="field"><label>New module installed</label><input type="text" id="nm2" placeholder="CS6R-395MS-HL 395W"></div>
    <div class="field"><label>New qty</label><input type="number" id="nq" placeholder="32"></div></div>`,
  module_layout_change:`<div class="field-grid full"><div class="field"><label>Layout adjustment description</label><input type="text" id="lc" placeholder="Minor field adjustments to array positioning to accommodate site conditions"></div></div>`,
  main_breaker_discrepancy:`<div class="field-grid">
    <div class="field"><label>Rating in plans</label><input type="text" id="pb2" placeholder="200A"></div>
    <div class="field"><label>Actual installed</label><input type="text" id="ab" placeholder="150A"></div></div>
    <div class="field-grid full" style="margin-top:12px"><div class="field"><label>Panel</label><select id="pt"><option value="main service panel (MSP)">Main service panel (MSP)</option><option value="subpanel">Subpanel</option></select></div></div>`,
  fuse_error:`<div class="field-grid">
    <div class="field"><label>Wrong rating (plans)</label><input type="text" id="wf" placeholder="60A"></div>
    <div class="field"><label>Correct rating (installed)</label><input type="text" id="cf" placeholder="150A"></div></div>`,
  dc_conductor_error:`<div class="field-grid">
    <div class="field"><label>Size in plans (wrong)</label><input type="text" id="wd" placeholder="8 AWG THWN"></div>
    <div class="field"><label>Correct size (installed)</label><input type="text" id="cd" placeholder="10 AWG THWN"></div></div>
    <div class="field-grid full" style="margin-top:12px"><div class="field"><label>Circuit / location</label><input type="text" id="dc2" placeholder="DC string conductor from rooftop array to inverter"></div></div>`,
  subpanel_error:`<div class="field-grid">
    <div class="field"><label>Rating in plans</label><input type="text" id="ps" placeholder="150A"></div>
    <div class="field"><label>Actual subpanel</label><input type="text" id="as2" placeholder="100A"></div></div>`,
  grounding_error:`<div class="field-grid">
    <div class="field"><label>Size in plans (wrong)</label><input type="text" id="wg" placeholder="#10 AWG"></div>
    <div class="field"><label>Size installed (correct)</label><input type="text" id="cg" placeholder="#6 AWG"></div></div>`,
  gec_insulation:`<div class="field-grid">
    <div class="field"><label>GEC size specified in plans</label><input type="text" id="gs" placeholder="#6 AWG"></div>
    <div class="field"><label>Type installed</label><select id="gt"><option value="insulated copper GEC">Insulated copper</option><option value="covered copper GEC">Covered copper</option></select></div></div>
    <div class="field-grid full" style="margin-top:12px"><div class="field"><label>Exact wording in plans</label><input type="text" id="gp" placeholder="#6 AWG G.E.C. (bare not specified)"></div></div>`,
  bonding_ac_disconnect:`<div class="field-grid full"><div class="field"><label>Issue found</label><select id="bi"><option value="no provision for bonding screw in disconnect enclosure">No provision for bonding screw</option><option value="bonding screw missing from disconnect">Bonding screw missing</option></select></div></div>
    <div class="field-grid full" style="margin-top:12px"><div class="field"><label>Solution installed</label><input type="text" id="bs" placeholder="#6 AWG conductor between neutral and ground bus"></div></div>`,
  conduit_fill:`<div class="field-grid">
    <div class="field"><label>Original config (plans)</label><input type="text" id="oc" placeholder='Two (2) 3/4" conduits'></div>
    <div class="field"><label>Installed config</label><input type="text" id="nc" placeholder='One (1) 1" conduit'></div></div>
    <div class="field-grid" style="margin-top:12px">
    <div class="field"><label>Conductors inside</label><input type="text" id="cnd" placeholder="10x #10 THHN ungrounded + 2x #10 THHN EGC"></div>
    <div class="field"><label>Reason</label><input type="text" id="cr2" placeholder="Reduce roof penetrations"></div></div>`,
  equipment_location:`<div class="field-grid">
    <div class="field"><label>Location in plans</label><input type="text" id="pl" placeholder="side of residence"></div>
    <div class="field"><label>Actual location</label><input type="text" id="al" placeholder="garage"></div></div>`,
  equipment_substitution:`<div class="field-grid">
    <div class="field"><label>Equipment in plans</label><input type="text" id="es2" placeholder="Eaton DG222NRB disconnect"></div>
    <div class="field"><label>Equipment installed</label><input type="text" id="ei" placeholder="Square D disconnect, equivalent rating"></div></div>
    <div class="field-grid full" style="margin-top:12px"><div class="field"><label>Context / reason</label><textarea id="ec2" placeholder="Addition to existing system. Both UL-listed, equivalent voltage rating and amperage capacity."></textarea></div></div>`,
  multiple_modifications:`<div class="field-grid full"><div class="field"><label>Modification 1</label><textarea id="m1" placeholder="e.g. Interconnection point changed from load side tap at subpanel to line side tap at MSP because no MBP in meter combo. NEC 705.12, NEC 240.21."></textarea></div></div>
    <div class="field-grid full" style="margin-top:12px"><div class="field"><label>Modification 2</label><textarea id="m2" placeholder="e.g. OCPD updated to 90A: two inverters SE10000H + SE5600H, combined 63.3A × 1.25 = 79.1A → next standard size per NEC 240.6(A)."></textarea></div></div>`,
  custom:`<div class="field-grid full"><div class="field"><label>Describe the field situation</label><textarea id="ci" placeholder="What plans showed vs. what was installed, why it changed, and what NEC sections apply..."></textarea></div></div>`
};

let selectedType = null, generatedLetter = '', letterMeta = {};

// Build type grid
(function(){
  const g = document.getElementById('typeGrid');
  TYPES.forEach(t => {
    const b = document.createElement('button');
    b.className = 'type-btn';
    b.setAttribute('data-id', t.id);
    b.innerHTML = `<span class="type-num">${String(t.n).padStart(2,'0')}</span><span class="type-label">${t.t}</span>`;
    b.onclick = () => selectType(t.id);
    g.appendChild(b);
  });
})();

function selectType(id) {
  selectedType = id;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-id') === id));
  const sec = document.getElementById('extra-section');
  const cont = document.getElementById('extra-content');
  if (EXTRA[id]) { cont.innerHTML = EXTRA[id]; sec.style.display = 'block'; }
  else sec.style.display = 'none';
  // update steps
  document.getElementById('s2').classList.add('active');
  if (EXTRA[id]) document.getElementById('s3').classList.add('active');
}

function gv(id) { const e = document.getElementById(id); return e ? e.value.trim() : ''; }

function buildSituation() {
  const M = {
    interconnection_change: `Interconnection method changed from "${gv('om')}" (approved plans) to "${gv('nm')}".\nReason: ${gv('cr')}.\nApplicable codes: NEC 705.11, NEC 705.12, NEC 230.82, NEC 110.3(B).`,
    tap_location: `Tap location change: approved plans showed load side tap at "${gv('otl')}". Due to site conditions, tap was performed at "${gv('atl')}". Interconnection method unchanged (load side); only the physical location of the tap was modified. NEC 705.12.`,
    supply_side_neutral: `Supply-side tap neutral/bonding clarification: service neutral conductor terminates directly at the neutral busbar inside the MSP and does not pass through the main breaker. PV system neutral connected to the same bus. Bonding connection removed from AC Disconnect; MSP remains the sole bonding point. NEC 705.11, NEC 250, NEC 110.3(B).`,
    neutral_inspector: `Response to inspector comment: "${gv('ic')}". System uses line-side tap configuration. Upon field review, the service neutral conductor terminates directly at the ${gv('np')} and is not routed through the main breaker. PV neutral connected to this same busbar — electrically equivalent to a line-side neutral tap. NEC 705.11, NEC 250, NEC 110.3(B).`,
    mlo_mbe: `Site condition: subpanel found to be a ${gv('mt')} with no integral main breaker, which does not support the originally designed load side tap. Solution: ${gv('ms')} was installed to serve as the required disconnecting means and provide overcurrent protection, allowing the load side tap interconnection to be completed per NEC 705.12.`,
    mbe_no_space: `Original plans specified a load side tap at the subpanel. Upon site arrival, ${gv('nsi')}. To comply with NEC 110.26 working space and accessibility requirements, the following solution was implemented: ${gv('nss')}. The interconnection type has not changed — only the physical location of the tap was adjusted to achieve full code compliance. NEC 705.12(B)(2), NEC 230.70(A), NEC 110.26, NEC 110.3(B).`,
    panel_model_change: `Module substitution: original design specified (${gv('oq')}) ${gv('om2')} modules, updated to (${gv('nq')}) ${gv('nm2')} modules. DC capacity variance remains within electrical design parameters. String configuration verified within inverter maximum input voltage and MPPT operational window per NEC 690.7. Final layout preserves all mandatory 36-inch fire access pathways and ventilation setbacks per NFPA 1. Modules listed to IEC 61730 standards. Florida Building Code and NFPA 70 compliance maintained.`,
    module_layout_change: `Module layout change: total module count remains identical to approved documentation. Field adjustment: ${gv('lc')}. Electrical design is unaffected — DC nameplate capacity, string configurations, and conductor sizing are exactly as indicated in the original design. System verified to operate within inverter parameters per NEC 690. All mandatory fire access pathways and ventilation setbacks per NFPA 1 preserved. Structural loading within engineered safety margins.`,
    main_breaker_discrepancy: `Main breaker discrepancy in ${gv('pt')}: approved plans indicated ${gv('pb2')} main breaker; actual installed main breaker is rated at ${gv('ab')}. This reflects the as-built configuration of the service equipment. The installed rating provides a more conservative condition for busbar loading, as the combined current from the utility and the PV system remains within allowable limits per NEC 705.12. All conductor sizing and electrical components verified compatible.`,
    fuse_error: `OCPD drafting error: approved plans incorrectly indicate a ${gv('wf')} fuse at the AC disconnect due to a drafting error. The correct and installed fuse size is ${gv('cf')}, which was properly installed in the field and complies with NEC 690.8, NEC 690.9, and NEC 705.60.`,
    dc_conductor_error: `DC conductor size documentation error: approved plans specify ${gv('wd')} for the ${gv('dc2')}. This is a drafting error. The correct conductor size per the inverter manufacturer specifications and NEC requirements is ${gv('cd')}, which was installed in the field. The DC string short-circuit current (Isc) × 125% continuous-load factor per NEC 690.8(B) does not exceed the ampacity of the installed conductor. Compliant with NEC 690.8(A), NEC 690.8(B), NEC 110.3(B), NEC Table 310.16, NEC 690.31.`,
    subpanel_error: `Subpanel main breaker discrepancy: approved plans indicated ${gv('ps')} subpanel main breaker; actual installed is ${gv('as2')}. This difference does not affect the interconnection method implemented (load side tap). The installed configuration meets applicable requirements per NEC 705.12, NEC 690.8, and NEC 110.3(B).`,
    grounding_error: `Grounding conductor documentation error: approved plans indicate ${gv('wg')} bare copper grounding conductor. The correct required conductor size per NEC 690.43 and NEC 250 is ${gv('cg')} bare copper, which was properly installed in the field. The discrepancy is limited to plan documentation only.`,
    gec_insulation: `GEC insulation clarification in response to inspection comment. Approved plans indicate "${gv('gp')}" without specifying bare copper. The installed conductor is a ${gv('gs')} ${gv('gt')}. Per NEC 250.62, grounding electrode conductors are permitted to be bare, covered, or insulated. The installed conductor maintains the same function, conductor sizing, grounding continuity, and electrical performance as intended by the approved design. Compliant with NEC 250.62, NEC 250, and NEC 110.3(B).`,
    bonding_ac_disconnect: `Bonding discrepancy at AC Disconnect: upon installation, it was determined that the disconnect enclosure had ${gv('bi')}. To provide the required bonding continuity, ${gv('bs')} was installed. This solution maintains compliance with the intent of the approved design and applicable NEC bonding requirements per NEC 250 and NEC 110.3(B).`,
    conduit_fill: `Conduit configuration change: approved plans indicate ${gv('oc')} between the roof junction box and the inverter. During installation, the configuration was optimized by utilizing ${gv('nc')} to ${gv('cr2')}. Conductors routed: ${gv('cnd')}. Conduit fill verified below 40% per NEC Chapter 9 Table 1. Conductor ampacity and adjustment factors reviewed per NEC 310.15(C)(1). Box fill per NEC 314.16. All compliant.`,
    equipment_location: `Equipment relocation: approved plans show equipment located at the ${gv('pl')}. Due to field conditions and installation practicality, equipment was relocated to the ${gv('al')}. All required working clearances, conductor sizing, disconnecting means, and equipment accessibility requirements have been maintained in accordance with NEC 110.26, NEC 690, and NEC 110.3(B). Equipment remains permanently installed and readily accessible.`,
    equipment_substitution: `Equipment substitution: approved plans reference ${gv('es2')}. Installed equipment: ${gv('ei')}. Context: ${gv('ec2')}. The installed equipment meets or exceeds the specified requirements including voltage rating, amperage capacity, and intended application. Equipment is UL-listed and suitable for this installation. The substitution does not impact the safety, performance, or code compliance of the system per NEC 110.3(B).`,
    nec_705_12: `Load side interconnection method per NEC 705.12(B)(3)(3). The PV system is interconnected on the load side of the service equipment utilizing a backfed photovoltaic breaker connected to the panelboard busbar, with the PV breaker installed at the opposite end of the main breaker as required by the National Electrical Code. Installed equipment ratings, breaker configuration, and placement have been reviewed and verified compliant.`,
    confirmation_supply: `Supply-side tap as-built confirmation following previous inspection comments regarding the neutral conductor connection. The PV system neutral conductor connection was reviewed and updated in the field to match the supply-side tap configuration of the ungrounded service conductors per the inspector's requested installation method. The supply-side tap conductors, including the grounded conductor (neutral), have been verified properly installed, protected, and terminated. NEC 705.11, NEC 250, NEC 110.3(B). Configuration accepted as the approved as-built condition.`,
    multiple_modifications: `This letter addresses two field modifications:\n\nModification 1:\n${gv('m1')}\n\nModification 2:\n${gv('m2')}`,
    custom: `Field situation: ${gv('ci')}`
  };
  let s = M[selectedType] || 'General field modification for grid-tie PV system in Florida.';
  const n = gv('notes'); if (n) s += `\n\nAdditional field notes: ${n}`;
  return s;
}

function buildPrompt() {
  const c = gv('client').toUpperCase() || 'CLIENT NAME';
  const a = gv('address').toUpperCase() || 'ADDRESS';
  const p = gv('permit') || 'PERMIT NUMBER';
  const d = new Date().toLocaleDateString('en-US', {month:'2-digit',day:'2-digit',year:'numeric'});
  return `You are drafting a professional engineering justification/certification letter for a residential solar PV installation in Florida to be reviewed by a building inspector.

HEADER:
Project: ${c}
Address: ${a}
Permit Number: ${p}
Date: ${d}
Contractor: AMERICAN SOLAR INSTALLATION COMPANY

SITUATION:
${buildSituation()}

INSTRUCTIONS:
- Write a short, direct CERTIFICATION LETTER addressed "TO WHOM IT MAY CONCERN"
- Begin the body with "CERTIFICATION LETTER" as the centered heading
- 2–4 focused paragraphs. Concise and factual. No filler phrases.
- For multiple modifications use bold subheadings per modification
- Reference exact NEC section numbers
- Confirm the installation is code-compliant and safe
- Final line must be: "Please feel free to contact us if additional clarification or supporting documentation is required."
- Then: "SINCERELY," then a blank line then "MATTHEW CRAIG (P.E)."
- Do NOT include company address or phone number in the body
- Use bullet list ONLY when citing 3 or more NEC sections
- Output ONLY the letter body starting from CERTIFICATION LETTER — no preamble, no commentary`;
}

async function generate() {
  if (!selectedType) { showToast('Please select a letter type first', true); return; }

  const btn = document.getElementById('genBtn');
  const status = document.getElementById('status');
  const out = document.getElementById('output-section');

  btn.disabled = true;
  btn.innerHTML = `<div class="spinner" style="border-top-color:white;border-color:rgba(255,255,255,0.3);border-top-color:white;width:18px;height:18px;"></div> Generating...`;
  status.style.display = 'flex';
  document.getElementById('status-text').textContent = 'Generating letter...';
  out.style.display = 'none';

  try {
    const GEMINI_KEY = 'AIzaSyDLuIKfIWedtnxd1e8vVBQwR5xfOfP0NtM';
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            role: 'user',
            parts: [{ text: buildPrompt() }]
          }],
          generationConfig: {
            maxOutputTokens: 1500,
            temperature: 0.3,
            candidateCount: 1
          },
          systemInstruction: {
            parts: [{ text: 'You are a professional PE engineer drafting certification letters for PV installations in Florida. Output only the letter body, no preamble or commentary.' }]
          }
        })
      }
    );
    const data = await res.json();
    const body = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Error generating letter.';

    const client = gv('client').toUpperCase() || 'CLIENT NAME';
    const addr = gv('address').toUpperCase() || 'ADDRESS';
    const permit = gv('permit') || 'PERMIT NUMBER';
    const date = new Date().toLocaleDateString('en-US', {month:'2-digit',day:'2-digit',year:'numeric'});

    const fullLetter = `2085 NW 2ND AVE MIAMI, FL 33127\nTel: 305-260-7000\n\nProject: ${client}\nAddress: ${addr}\nPermit Number: ${permit}\nSystem: INSTALLATION OF GRID-TIE PV SYSTEM\nDate: ${date}          Contractor: AMERICAN SOLAR INSTALLATION COMPANY\n\n${body}`;

    generatedLetter = fullLetter;
    letterMeta = { client, address: addr, permit, date, rawBody: body };

    document.getElementById('letterPreview').textContent = fullLetter;
    out.style.display = 'block';
    status.style.display = 'none';

    // Update steps
    document.getElementById('s4').classList.add('active');

    // Auto-download PDF
    document.getElementById('status-text').textContent = 'Generating PDF...';
    status.style.display = 'flex';
    await new Promise(r => setTimeout(r, 300));
    status.style.display = 'none';
    downloadPDF(true);

    out.scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch(e) {
    document.getElementById('status-text').textContent = 'Error: ' + e.message;
  }

  btn.disabled = false;
  btn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> Generate letter & download PDF`;
}

function downloadPDF(auto = false) {
  if (!generatedLetter) return;
  const { jsPDF } = window.jspdf;

  // US Letter, Times-based to match original document look
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  const PW = doc.internal.pageSize.getWidth();   // 612
  const PH = doc.internal.pageSize.getHeight();  // 792
  const ML = 72, MR = 72;   // 1-inch margins
  const usable = PW - ML - MR;  // 468pt
  const FS = 11;   // body font size matching original
  const LH = 15;   // line height

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(FS);
  doc.setTextColor(0, 0, 0);

  // ── HEADER BLOCK — single column, plain text, matches original exactly ──
  let y = 72;

  // Line 1: address + tel on same line (matches "2085 NW 2ND AVE MIAMI, FL 33127")
  doc.setFont('helvetica', 'normal');
  doc.text('2085 NW 2ND AVE MIAMI, FL 33127', ML, y);
  y += LH;
  doc.text('Tel: 305-260-7000', ML, y);
  y += LH * 1.5;

  // Project fields — plain, no bold labels, one per line
  const m = letterMeta;
  const today = m.date || new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});

  doc.text('Project: ' + (m.client || ''), ML, y); y += LH;
  doc.text('Address: ' + (m.address || ''), ML, y); y += LH;
  doc.text('Permit Number: ' + (m.permit || ''), ML, y); y += LH;
  doc.text('System: INSTALLATION OF GRID-TIE PV SYSTEM', ML, y); y += LH;

  // Date + Contractor on same line (tab-separated like original)
  const dateStr = 'Date: ' + today;
  const contractorStr = 'Contractor: AMERICAN SOLAR INSTALLATION COMPANY';
  doc.text(dateStr, ML, y);
  // Contractor right-aligned to match original layout
  const contractorX = ML + usable - doc.getTextWidth(contractorStr);
  doc.text(contractorStr, Math.max(ML + 180, contractorX), y);
  y += LH * 2.2;

  // ── CERTIFICATION LETTER — centered, bold ──
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(FS);
  doc.text('CERTIFICATION LETTER', PW / 2, y, { align: 'center' });
  y += LH * 2;

  // ── BODY — parse and render with justification ──
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(FS);

  // Helper: render justified paragraph
  function renderJustified(text, x, startY, lineWidth) {
    const words = text.split(' ').filter(w => w.length > 0);
    let line = [];
    let lineW = 0;
    let curY = startY;
    const spaceW = doc.getTextWidth(' ');

    for (let i = 0; i < words.length; i++) {
      const w = words[i];
      const wW = doc.getTextWidth(w);
      if (lineW + wW + (line.length > 0 ? spaceW : 0) > lineWidth && line.length > 0) {
        // Justify this line (not the last line of paragraph)
        const isLastLine = (i === words.length - 1) || false;
        renderLine(line, x, curY, lineWidth, false);
        curY += LH;
        line = [w];
        lineW = wW;
      } else {
        if (line.length > 0) lineW += spaceW;
        line.push(w);
        lineW += wW;
      }
    }
    // Last line — left aligned
    if (line.length > 0) {
      renderLine(line, x, curY, lineWidth, true);
      curY += LH;
    }
    return curY;
  }

  function renderLine(words, x, lineY, lineWidth, isLast) {
    if (words.length === 0) return;
    if (isLast || words.length === 1) {
      doc.text(words.join(' '), x, lineY);
      return;
    }
    const totalTextW = words.reduce((s, w) => s + doc.getTextWidth(w), 0);
    const totalGap = lineWidth - totalTextW;
    const gapPerSpace = totalGap / (words.length - 1);
    let cx = x;
    words.forEach((w, i) => {
      doc.text(w, cx, lineY);
      cx += doc.getTextWidth(w) + (i < words.length - 1 ? gapPerSpace : 0);
    });
  }

  const bodyLines = letterMeta.rawBody.split('\n');

  for (let i = 0; i < bodyLines.length; i++) {
    const raw = bodyLines[i];
    const line = raw.trim();

    if (y > PH - 100) { doc.addPage(); y = 72; }

    // Skip "CERTIFICATION LETTER" — already rendered above
    if (/^CERTIFICATION LETTER/.test(line)) continue;

    // Empty line → paragraph spacing
    if (!line) { y += LH * 0.6; continue; }

    // TO WHOM IT MAY CONCERN
    if (/^TO WHOM IT MAY CONCERN/.test(line)) {
      doc.setFont('helvetica', 'normal');
      doc.text(line, ML, y);
      y += LH * 1.4;
      continue;
    }

    // SINCERELY
    if (/^SINCERELY/.test(line)) {
      y += LH * 0.5;
      doc.setFont('helvetica', 'normal');
      doc.text('SINCERELY,', ML, y);
      y += LH * 2.2;
      continue;
    }

    // PE signature — italic
    if (/MATTHEW CRAIG/.test(line)) {
      doc.setFont('helvetica', 'italic');
      doc.text('MATTHEW CRAIG (P.E).', ML, y);
      doc.setFont('helvetica', 'normal');
      y += LH;
      continue;
    }

    // Modification subheadings — bold
    if (/^(Modification \d+:|##)/.test(line)) {
      doc.setFont('helvetica', 'bold');
      const clean = line.replace(/^\*\*|\*\*$/g, '').replace(/^##\s*/, '');
      doc.text(clean, ML, y);
      doc.setFont('helvetica', 'normal');
      y += LH * 1.3;
      continue;
    }

    // Bullet points
    if (/^[•\-\*]\s/.test(line)) {
      const txt = line.replace(/^[•\-\*]\s/, '');
      doc.text('•', ML + 6, y);
      const bulletIndent = ML + 18;
      const bulletWidth = usable - 18;
      const wrapped = doc.splitTextToSize(txt, bulletWidth);
      wrapped.forEach((wl, wi) => {
        if (y > PH - 100) { doc.addPage(); y = 72; }
        doc.text(wl, bulletIndent, y);
        if (wi < wrapped.length - 1) y += LH;
      });
      y += LH * 1.1;
      continue;
    }

    // "Please feel free..." — standard closing, justified
    if (/^Please feel free/.test(line)) {
      y += LH * 0.3;
      y = renderJustified(line, ML, y, usable);
      y += LH * 0.5;
      continue;
    }

    // Regular paragraph — justified
    y = renderJustified(line, ML, y, usable);
    y += LH * 0.5;
  }

  const fname = (m.client || 'letter').replace(/\s+/g, '_') + '_justification.pdf';
  doc.save(fname);
  if (auto) showToast('PDF downloaded — ' + fname);
}

function copyLetter() {
  navigator.clipboard.writeText(generatedLetter).then(() => showToast('Letter copied to clipboard'));
}

function resetForm() {
  selectedType = null;
  generatedLetter = '';
  letterMeta = {};
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('extra-section').style.display = 'none';
  document.getElementById('output-section').style.display = 'none';
  document.getElementById('client').value = '';
  document.getElementById('permit').value = '';
  document.getElementById('address').value = '';
  document.getElementById('notes').value = '';
  ['s1','s2','s3','s4'].forEach((id, i) => {
    const el = document.getElementById(id);
    el.classList.toggle('active', i === 0);
    el.classList.remove('done');
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
  showToast('Form cleared — ready for new letter');
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  document.getElementById('toast-text').textContent = msg;
  t.style.background = isError ? '#c0392b' : '#111815';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}
